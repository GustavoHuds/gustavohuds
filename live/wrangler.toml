name = "ryumon"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Ordem em que os sistemas aparecem no painel. Qualquer nome fora desta
# lista é recusado pelo /ingest (lista permitida, §11.6).
[vars]
SYSTEMS = "BELPonto,BELeads,Website,ExtractNeoron,BELPreço,BINAH,NinjaCash,Txintxa do Gigi,Belmont Monitor,Ttalk Bot Manager,Cockpit,MAPservice"

# Criar com: npx wrangler kv namespace create PROFILE  → colar o id aqui
[[kv_namespaces]]
binding = "PROFILE"
id = "REPLACE_WITH_KV_ID"

# Limite de requisições no /ingest (por IP)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Segredo (não fica no repositório):  npx wrangler secret put INGEST_TOKEN
