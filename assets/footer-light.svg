<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t d"><title id="t">Night falls on the sea</title><desc id="d">Full moon over the sea with drifting clouds and a red hanko seal. The gate is the beginning, not the end.</desc><defs><style>@font-face{font-family:RyMincho;src:url(data:font/woff2;base64,) format(&apos;woff2&apos;);font-weight:400;}@font-face{font-family:RyMinchoB;src:url(data:font/woff2;base64,) format(&apos;woff2&apos;);font-weight:700;}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ry-draw var(--d,1.6s) cubic-bezier(.65,0,.35,1) var(--t,0s) forwards}
.reveal{opacity:0;animation:ry-in var(--d,.8s) cubic-bezier(.65,0,.35,1) var(--t,0s) forwards}
.rise{opacity:0;animation:ry-rise var(--d,1.2s) cubic-bezier(.65,0,.35,1) var(--t,0s) forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:var(--o,center);animation:ry-pop var(--d,.45s) cubic-bezier(.2,1.4,.4,1) var(--t,0s) forwards}
.wipe{clip-path:inset(0 100% 0 0);animation:ry-wipe var(--d,.9s) cubic-bezier(.65,0,.35,1) var(--t,0s) forwards}
.stamp{opacity:0;transform-box:fill-box;transform-origin:center;animation:ry-stamp .38s cubic-bezier(.2,1.4,.4,1) var(--t,0s) forwards}
@keyframes ry-draw{to{stroke-dashoffset:0}}
@keyframes ry-in{to{opacity:1}}
@keyframes ry-rise{from{opacity:0;transform:translateY(var(--dy,40px))}to{opacity:1;transform:none}}
@keyframes ry-pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@keyframes ry-wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes ry-stamp{0%{opacity:0;transform:scale(1.35) rotate(-4deg)}70%{opacity:1}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
